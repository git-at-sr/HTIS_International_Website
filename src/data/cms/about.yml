mission:
  sectionId: mission
  image: src/assets/1776007843793.jpg
  imageAlt: Writing vision on boards
  cards:
    - title: Our Vision
      description: To shape the future of global connectivity and digital
        infrastructure by delivering seamless, next-generation enterprise
        solutions that empower businesses to scale sustainably.
    - title: Our Mission
      description: To deliver dependable, high-performance IT infrastructure and
        telecom services through continuous engineering innovation, operational
        excellence, and lasting client partnerships.
    - title: Our Value
      description: We are anchored in reliability, professional integrity, and an
        unyielding commitment to engineering excellence. We believe in
        collaborative success and creating practical impact.
lifeAtHtis:
  sectionId: life-at-htis
  backgroundImage: src/assets/about-life-at-htis-bg.png
  image: src/assets/lifeathtis.png
  imageAlt: Collage of team and office life at HTIS
  title: Life at [HTIS]{color=primary}
  body:
    - At HTIS, our culture thrives on collaboration, continuous growth, and an
      inclusive community where every voice is valued. We foster an environment
      of professional excellence combined with creative freedom.
    - Whether building next-generation telecom networks or integrating complex
      enterprise IT infrastructures, our teams work together to solve meaningful
      challenges. We invite you to bring your passion and join our growing team.
  ctaLabel: See Open Roles
  ctaUrl: /jobs
